name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Show the toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Test
        run: swift test

  docs:
    name: Build Documentation
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build
        run: Scripts/docs.sh

  platforms:
    name: Build ${{ matrix.destination }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        destination: [iOS, tvOS, macOS]
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Build
        run: >
          xcodebuild -scheme Mosaic
          -destination "generic/platform=${{ matrix.destination }}"
          -derivedDataPath "$RUNNER_TEMP/dd"
          CODE_SIGNING_ALLOWED=NO -quiet build
